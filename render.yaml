services:
  - type: web
    name: rental-management-api
    env: python
    plan: free
    runtime: python
    pythonVersion: "3.12.10"
    rootDir: Backend
    buildCommand: |
      python -m pip install --upgrade pip setuptools wheel
      pip install -r requirements.txt
    startCommand: |
      python manage.py migrate --noinput &&
      python manage.py collectstatic --noinput &&
      python manage.py create_admin &&
      python manage.py backfill_account_ids &&
      gunicorn rms.wsgi:application --bind 0.0.0.0:$PORT --workers 3
    envVars:
      - key: PORT
        value: 8000
      - key: PYTHON_VERSION
        value: "3.12.10"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: DB_NAME
        value: rms_database
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "3306"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://rental-management-services.vercel.app"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://rental-management-services.vercel.app"

  - type: cron
    name: rental-management-keepalive
    schedule: "*/2 * * * *"
    rootDir: Backend
    startCommand: python -c "import urllib.request; urllib.request.urlopen('https://rental-management-api.onrender.com/api/ping/')"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.10"
